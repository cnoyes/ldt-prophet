name: CI

on:
  push:
    branches: [master]
    paths: ['DESCRIPTION', 'src/**', 'scripts/**', 'tests/**', '.github/workflows/**']
  pull_request:
    paths: ['DESCRIPTION', 'src/**', 'scripts/**', 'tests/**', '.github/workflows/**']

jobs:
  workflow-packages:
    name: DESCRIPTION Imports cover every package the pipeline needs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
      - run: Rscript tests/test_workflow_packages.R
