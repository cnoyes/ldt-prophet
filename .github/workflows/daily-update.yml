name: Daily Prophet Calculator Update

on:
  schedule:
    # Run daily at 6 AM UTC (midnight MST)
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger
    inputs:
      skip_deploy:
        description: 'Dry run: run the whole pipeline but do not commit data or deploy to Vercel'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-calculations:
    runs-on: ubuntu-latest
    # Deploy waits in the Vercel build queue (one concurrent build per account),
    # which has pushed a 90 s job past 10 min (#6). Historical deploy time ~40 s.
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      # Installs DESCRIPTION Imports (pak), their system libraries, and keeps a
      # package cache keyed on OS release + R version, so an ubuntu-latest
      # migration cannot restore binaries built for the old image (#4, #7).
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'

      - name: Run calculations with updated ages
        run: |
          # Recalculate probabilities with current date (ages update daily)
          Rscript run_all.R

      - name: Export data to JSON for web app
        run: |
          Rscript scripts/export_to_json.R

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet derived_data/ web/public/apostles.json public/data/apostles.json; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changes == 'true' && inputs.skip_deploy != true
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add derived_data/ web/public/apostles.json public/data/apostles.json
          git commit -m "chore: update apostle succession probabilities (daily recalculation)"
          git pull --rebase
          git push

      - name: Deploy to production (if changed)
        if: steps.check_changes.outputs.changes == 'true' && inputs.skip_deploy != true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel
          cd web
          vercel --prod --token=$VERCEL_TOKEN
